services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    ports:
      # DNS Ports
      - "53:53/tcp"
      - "53:53/udp"
      # Uncomment the line below if you are using Pi-hole as your DHCP server
      #- "67:67/udp"
      # Uncomment the line below if you are using Pi-hole as your NTP server
      #- "123:123/udp"
      # Web UI is no longer published to the host directly — Caddy reverse-proxies to it
      # over the homelab network instead (see caddy/Caddyfile).

    environment:
      TZ: Europe/Oslo
      FTLCONF_dns_listeningMode: ALL
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}
      FTLCONF_dns_upstreams: '1.1.1.1;9.9.9.9;8.8.8.8'

    volumes:
      - ./data:/etc/pihole

    networks:
      - homelab

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    restart: unless-stopped

networks:
  homelab:
    external: true

services:
  dht22:
    container_name: dht22
    build: .
    environment:
      TZ: Europe/Oslo
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_TOPIC_PREFIX: home/dht22
      SAMPLE_INTERVAL_SECONDS: "15"
      PUBLISH_INTERVAL_SECONDS: "120"
      # Docker masks /sys/firmware in unprivileged containers, so Blinka's board
      # autodetection (which reads /proc/device-tree, a symlink into /sys/firmware)
      # can't identify the Pi and raises NotImplementedError on `import board`.
      # Force it instead of trying to unmask /sys/firmware (which needs --privileged).
      BLINKA_FORCECHIP: BCM2XXX
      BLINKA_FORCEBOARD: RASPBERRY_PI_5
    # Blinka's lgpio backend scans the host's real /sys/bus/gpio/devices to find
    # whichever gpiochip number the kernel assigned RP1's GPIO driver to — that
    # number isn't stable across kernel versions (it's moved between 0, 4, and
    # others upstream), so /dev/gpiochip4 alone doesn't reliably match. Privileged
    # avoids chasing that number every kernel update.
    privileged: true
    networks:
      - homelab
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

networks:
  homelab:
    external: true
